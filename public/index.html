<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Держава — геополитическая стратегия</title>
  <meta name="description" content="Браузерная геополитическая стратегия с глубокой экономикой, торговлей и политикой">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1l7 7-7 7-7-7z' fill='%231f5fbf'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="screen" class="screen"></div>
  <div id="game" hidden>
    <header class="top">
      <div class="brand"><i></i><span>ДЕРЖАВА</span></div>
      <div id="who" class="who"></div>
      <div id="clock" class="clock">
        <span id="saving" class="saving"></span>
        <div class="date" id="date"></div>
        <div class="seg">
          <button data-speed="0" title="Пауза (пробел)">❚❚</button>
          <button data-speed="1" title="Медленно: месяц за 4 с">▶</button>
          <button data-speed="2" title="Нормально: месяц за 2 с">▶▶</button>
          <button data-speed="3" title="Быстро: месяц за 1 с">▶▶▶</button>
        </div>
        <button class="btn primary" id="nextbtn" title="Enter">Следующий месяц</button>
      </div>
      <div id="tools" class="tools">
        <button class="btn inboxbtn" data-tool="inbox" title="Донесения">Донесения<span id="inboxcount" class="badge" hidden>0</span></button>
        <button class="btn" data-tool="save">Сохранить</button>
        <button class="btn" data-tool="load">Загрузить</button>
        <button class="btn" data-tool="exit" title="Сохранить и выйти в меню">Меню</button>
      </div>
    </header>
    <div id="inds" class="inds"></div>
    <main class="layout">
      <div id="mapwrap" class="mapwrap">
        <svg id="map" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="mapbar"><div class="seg" id="mapmodes">
          <button data-mode="political" class="on">Политическая</button>
          <button data-mode="relations">Отношения</button>
          <button data-mode="bloc">Блоки</button>
          <button data-mode="gdppc">Богатство</button>
          <button data-mode="stability">Стабильность</button>
          <button data-mode="resources">Ресурсы</button>
          <button data-mode="terrain">Рельеф</button>
        </div></div>
        <div class="zoom" id="zoomctl"><button data-z="+" title="Приблизить">+</button><button data-z="-" title="Отдалить">−</button><button data-z="0" title="Вся карта">⤢</button></div>
        <div id="legend" class="legend"></div>
        <div id="tip" class="tip" hidden></div>
      </div>
      <aside class="side">
        <nav id="rail" class="rail"></nav>
        <section class="content">
          <div class="chead"><h2 id="ctitle"></h2><div id="subtabs" class="subtabs"></div></div>
          <div id="cbody" class="cbody"></div>
        </section>
      </aside>
    </main>
  </div>
  <div id="drawer" class="drawer" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
